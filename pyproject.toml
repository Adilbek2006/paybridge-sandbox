[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paybridge"
version = "0.1.0"
description = "PayBridge: REST API service for payment system integration (sandbox)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5", "locust>=2.24"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/unit", "tests/acceptance"]

[tool.setuptools.packages.find]
where = ["src"]
